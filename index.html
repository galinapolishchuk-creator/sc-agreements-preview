<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#F7F6F5;color:#000;font-family:'Manrope',system-ui,sans-serif}
.gate{width:340px;padding:28px;border-radius:12px;background:#fff;
  border:1px solid #DBDAD5;box-shadow:0 4px 14px rgba(0,0,0,.12)}
h1{font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
p{margin-top:8px;font-size:12px;line-height:18px;color:#5A5A5A}
form{margin-top:20px;display:flex;flex-direction:column;gap:10px}
input{height:42px;padding:0 12px;border:1px solid #DBDAD5;border-radius:6px;
  background:#fff;font-family:inherit;font-size:14px;color:#000}
input:focus{outline:none;border-color:#664F3E}
button{height:42px;border:none;border-radius:6px;background:#28ACE4;color:#fff;
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:16px;font-size:11px;color:#C75757}
body.opened{display:block;background:#F7F6F5}
</style>
</head>
<body>
<div class="gate">
  <h1>Protected</h1>
  <p>This prototype is shared privately. Enter the password you were given to open it.</p>
  <form id="g">
    <input id="p" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    <button id="b" type="submit">Open</button>
    <span class="err" id="e"></span>
  </form>
</div>

var b64 = function (s) {
  var raw = atob(s), out = new Uint8Array(raw.length)
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i)
  return out
}
document.getElementById('g').addEventListener('submit', function (ev) {
  ev.preventDefault()
  var err = document.getElementById('e')
  var btn = document.getElementById('b')
  err.textContent = ''
  btn.disabled = true
  btn.textContent = 'Opening…'
  crypto.subtle
    .importKey('raw', new TextEncoder().encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      )
    })
    .then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.body))
    })
    .then(function (buf) {
      var html = new TextDecoder().decode(buf)
      /* Разворачиваем во фрейм, а не через document.write в текущий документ:
         приложение монтируется по DOMContentLoaded, а переписанный на ходу
         документ это событие даёт не везде — во фрейме разбор обычный. */
      var frame = document.createElement('iframe')
      frame.setAttribute('title', 'Prototype')
      frame.setAttribute('style', 'position:fixed;left:0;top:0;width:100%;height:100%;border:0')
      document.body.className = 'opened'
      document.body.innerHTML = ''
      document.body.appendChild(frame)
      var fd = frame.contentDocument
      fd.open()
      fd.write(html)
      fd.close()
    })
    .catch(function () {
      btn.disabled = false
      btn.textContent = 'Open'
      err.textContent = 'Wrong password'
    })
})
