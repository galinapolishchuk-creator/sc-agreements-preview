var b64 = function (s) {
  var raw = atob(s), out = new Uint8Array(raw.length)
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i)
  return out
}
document.getElementById('g').addEventListener('submit', function (ev) {
  ev.preventDefault()
  var err = document.getElementById('e')
  var btn = document.getElementById('b')
  err.textContent = ''
  btn.disabled = true
  btn.textContent = 'Opening…'
  crypto.subtle
    .importKey('raw', new TextEncoder().encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveKey'])
    .then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      )
    })
    .then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.body))
    })
    .then(function (buf) {
      var html = new TextDecoder().decode(buf)
      /* Разворачиваем во фрейм, а не через document.write в текущий документ:
         приложение монтируется по DOMContentLoaded, а переписанный на ходу
         документ это событие даёт не везде — во фрейме разбор обычный. */
      var frame = document.createElement('iframe')
      frame.setAttribute('title', 'Prototype')
      frame.setAttribute('style', 'position:fixed;left:0;top:0;width:100%;height:100%;border:0')
      document.body.className = 'opened'
      document.body.innerHTML = ''
      document.body.appendChild(frame)
      var fd = frame.contentDocument
      fd.open()
      fd.write(html)
      fd.close()
    })
    .catch(function () {
      btn.disabled = false
      btn.textContent = 'Open'
      err.textContent = 'Wrong password'
    })
})
